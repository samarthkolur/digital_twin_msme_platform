packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # esbuild (vite's bundler) and unrs-resolver (eslint-plugin-import-x's
  # resolver) both need their native postinstall build steps to function.
  esbuild: true
  unrs-resolver: true
overrides:
  # vitest 3.2.7's own vite-node/@vitest/mocker sub-dependencies resolve an
  # older vite (5.4.21) independently of the workspace's direct vite
  # dependency; force everything onto the patched line (GHSA-fx2h-pf6j-xcff,
  # fixed in 6.4.3) so `pnpm audit` doesn't flag the transitive copy.
  vite: "^8.3.0"
  # Newly-disclosed advisories (as of this override, none tied to any code
  # change here) in deep transitive deps of dev-only tooling — commitlint's
  # ajv->fast-uri, eslint's own js-yaml/minimatch->brace-expansion chain, and
  # vitest coverage's glob->minimatch->brace-expansion chain. Same pattern as
  # the vite override above: force every transitive copy onto the patched
  # line so `pnpm audit --audit-level=high` stays clean.
  fast-uri: ">=4.1.5"
  js-yaml: ">=5.4.1"
  postcss: ">=8.5.18"
  nanoid: ">=3.3.18"
  # brace-expansion needs per-major-line targeting (not a single blanket
  # override like the others above): minimatch@3.x's own code calls an API
  # (`.braceExpand`) that only the 1.x line of brace-expansion has, so
  # forcing every consumer to one version broke ESLint outright (`TypeError:
  # expand is not a function`) — confirmed by testing `make lint`, not
  # assumed. An open-ended `>=1.1.18` range doesn't stay within the 1.x
  # line either (pnpm resolves it to the newest version satisfying that
  # inequality, i.e. the same 5.x it was supposed to avoid) — `^1.1.18`
  # caret-range pins it to patched 1.x only, confirmed via `pnpm why
  # brace-expansion` after each attempt.
  minimatch@3>brace-expansion: "^1.1.21"
  minimatch@9>brace-expansion: "^2.1.7"
  minimatch@10>brace-expansion: "^5.0.12"
  # A second wave of advisories in the same category (dev-only transitive
  # deps, no code change involved): browserslist/baseline-browser-mapping/
  # source-map-js under vite + babel, and knip's smol-toml. Caret ranges keep
  # each on its current major line. braces (via knip 5's fast-glob) and
  # tinypool (critical, via vitest 3) have no patched release on the line
  # their parents accept, so those are fixed by upgrading knip to 6.x and
  # vitest to 4.x instead of an override (design.md DD-044).
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
  source-map-js: "^1.2.2"
  smol-toml: "^1.8.1"

name: digital-cousin

x-py-healthcheck: &py-healthcheck
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  # --- Toolbox: lint/format/typecheck/test + git hooks. Not part of the
  # default `up`/`watch` stack — invoked explicitly via `make lint`, etc.
  toolbox:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    # Run as the invoking host user so files written through the bind mount
    # (caches, coverage, formatted sources, git objects from the pre-commit
    # hook) are owned by that user rather than root (design.md DD-039). The
    # Makefile and the Husky hooks export these; the 0:0 default preserves the
    # previous root behaviour for anyone invoking the service directly.
    user: "${TOOLBOX_UID:-0}:${TOOLBOX_GID:-0}"
    environment:
      # Non-interactive: `docker compose run` has no TTY, and pnpm otherwise
      # prompts to confirm node_modules changes when the bind-mounted
      # install state doesn't exactly match its expectations.
      CI: "true"
    volumes:
      - .:/workspace
    working_dir: /workspace

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      <<: *py-healthcheck

  # --- Project-wide runtime config (design.md DD-047). Owns the app_config
  # table in the shared SQLite volume; every other service reads it over HTTP.
  config:
    build:
      context: .
      dockerfile: services/config/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_PATH: /data/digital_cousin.sqlite3
      # Seeds for a fresh database only. Once a setting is stored, change it
      # with `make phase2-on|phase2-off`, the dashboard, or PATCH /config.
      ENABLE_PHASE2: ${ENABLE_PHASE2:-false}
      PUBLISH_INTERVAL_SECONDS: "5"
      COPILOT_LLM_MODE: ${COPILOT_LLM_MODE:-local}
    volumes:
      - sqlite-data:/data
    develop:
      watch:
        - path: ./services/config/src
          target: /app/src
          action: sync
        - path: ./services/config/pyproject.toml
          action: rebuild
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      <<: *py-healthcheck

  edge:
    build:
      context: .
      dockerfile: services/edge/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      config:
        condition: service_healthy
    environment:
      SENSOR_PROVIDER: ${SENSOR_PROVIDER:-simulated}
      ASSET_ID: ${ASSET_ID:-motor_01}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DATABASE_PATH: /data/digital_cousin.sqlite3
      CONFIG_URL: http://config:8002
      # Fallbacks used only until the config service first answers.
      ENABLE_PHASE2: ${ENABLE_PHASE2:-false}
      PUBLISH_INTERVAL_SECONDS: "5"
      ML_ARTIFACTS_DIR: /app/ml-artifacts
      # Audible alerting (design.md DD-040): "none" never touches GPIO, so dev
      # machines and CI stay silent; set BUZZER=gpio on a Pi with a buzzer fitted.
      BUZZER: ${BUZZER:-none}
      BUZZER_GPIO_PIN: ${BUZZER_GPIO_PIN:-18}
    volumes:
      - sqlite-data:/data
      # Same host path the ml-trainer profile writes into (below) — read-only
      # here since edge only consumes trained models, never produces them.
      # Absent until `make train` has run at least once (design.md §24);
      # MLInferenceEngine.load() handles that by disabling inference, not
      # failing startup.
      - ./services/ml/artifacts:/app/ml-artifacts:ro
    develop:
      watch:
        - path: ./services/edge/src
          target: /app/src
          action: sync
        - path: ./services/edge/pyproject.toml
          action: rebuild
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      <<: *py-healthcheck

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ASSET_ID: ${ASSET_ID:-motor_01}
      DATABASE_PATH: /data/digital_cousin.sqlite3
    volumes:
      - sqlite-data:/data
    develop:
      watch:
        - path: ./services/api/src
          target: /app/src
          action: sync
        - path: ./services/api/pyproject.toml
          action: rebuild
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      <<: *py-healthcheck

  # --- Phase 2 only: started when enablePhase2 is on (`make up`/`make watch`
  # read it from the config database and add the "phase2" profile).
  copilot:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      config:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      # SECRETS_FILE is always set once .env exists (bootstrap.sh copies it from
      # .env.example, whose default is $HOME/.config/digital-cousin/secrets.env,
      # DD-010) — the fallback below only matters if compose runs with no .env
      # at all, so it deliberately points at a real, if empty, gitignored path
      # rather than a nonexistent directory.
      - path: ${SECRETS_FILE:-./.secrets.env.local}
        required: false
    environment:
      COPILOT_LLM_MODE: ${COPILOT_LLM_MODE:-local}
      API_URL: http://api:8000
      CONFIG_URL: http://config:8002
      ENABLE_PHASE2: ${ENABLE_PHASE2:-false}
    develop:
      watch:
        - path: ./services/copilot/src
          target: /app/src
          action: sync
        - path: ./services/copilot/pyproject.toml
          action: rebuild
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      <<: *py-healthcheck

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_COPILOT_URL: http://localhost:8001
      VITE_CONFIG_URL: http://localhost:8002
    develop:
      watch:
        - path: ./apps/dashboard/src
          target: /workspace/apps/dashboard/src
          action: sync
        - path: ./apps/dashboard/index.html
          target: /workspace/apps/dashboard/index.html
          action: sync
        - path: ./apps/dashboard/package.json
          action: rebuild
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5173/"]
      <<: *py-healthcheck

  # --- Training job: not started by `up`/`watch`. Run via `make train`, which
  # refuses while Phase 2 is disabled (the models are a Phase 2 feature).
  ml-trainer:
    profiles: ["training"]
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    volumes:
      - ./services/ml/data:/app/data
      - ./services/ml/artifacts:/app/artifacts

volumes:
  sqlite-data:
  mosquitto-data:

# Production / Raspberry Pi deployment overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Switches every service to its `prod` build target (no dev-server hot
# reload), removes `develop.watch` (irrelevant outside local dev), and gives
# the edge service real hardware access for the ADXL345 (SPI) and DS18B20
# (1-Wire) sensors. Deploy this file to the Raspberry Pi 4 target.

services:
  edge:
    build:
      target: prod
    develop: !reset []
    environment:
      SENSOR_PROVIDER: hardware
    devices:
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/gpiomem:/dev/gpiomem"
    volumes:
      - /sys/bus/w1:/sys/bus/w1
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      target: prod
    develop: !reset []
    deploy:
      resources:
        limits:
          memory: 256M

  copilot:
    build:
      target: prod
    develop: !reset []
    environment:
      COPILOT_LLM_MODE: local
    deploy:
      resources:
        limits:
          memory: 1024M

  dashboard:
    build:
      target: prod
    develop: !reset []
    ports: !override
      - "8080:8080"
    healthcheck:
      # 127.0.0.1, not localhost: this container's /etc/hosts resolves
      # "localhost" to ::1 (IPv6) only, and nginx's `listen 8080;` is
      # IPv4-only, so busybox wget (no multi-address fallback, unlike curl)
      # fails outright on the IPv6 attempt — confirmed via `getent hosts
      # localhost` returning only `::1` and `wget http://localhost:8080`
      # failing with "Connection refused" while `wget http://127.0.0.1:8080`
      # and host-side `curl http://localhost:8080` (masked by curl's
      # fallback behavior) both succeeded.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    deploy:
      resources:
        limits:
          memory: 128M

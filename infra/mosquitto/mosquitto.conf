# Local-only MQTT broker for intra-device messaging between the edge service
# and other layers (design.md §6.1). Not exposed beyond the docker network in
# production; anonymous access is acceptable for a single-tenant, offline,
# LAN-local deployment. Revisit (auth + TLS) if the broker is ever exposed
# beyond localhost — tracked in design.md Technical Debt.
listener 1883
protocol mqtt

allow_anonymous true
persistence true
persistence_location /mosquitto/data/

log_dest stdout

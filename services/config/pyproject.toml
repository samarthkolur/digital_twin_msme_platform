[project]
name = "appconfig"
version = "0.1.0"
description = "Digital Cousin config service: the project-wide runtime configuration, stored in SQLite"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.152.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "mypy>=2.4.0",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appconfig"]

[tool.mypy]
strict = true
files = "src"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

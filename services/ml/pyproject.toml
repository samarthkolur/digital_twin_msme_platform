[project]
name = "ml"
version = "0.1.0"
description = "Digital Cousin ML training pipeline: Isolation Forest + 1D conv autoencoder on CWRU/IMS datasets"
requires-python = ">=3.11,<3.12"
dependencies = [
  "scikit-learn>=1.9.1",
  "torch>=2.5",
  "numpy>=2.0",
  "pandas>=3.0.5",
  # Reads real CWRU .mat files (ml.cwru_loader) — design.md DD-042.
  "scipy>=1.13",
  # ONNX export (design.md DD-031, supersedes the originally documented
  # TFLite target): torch.onnx.export is built into torch already; skl2onnx
  # converts the Isolation Forest so both models share one runtime
  # (onnxruntime) at inference time in services/edge.
  "onnx>=1.23.2",
  "skl2onnx>=1.17",
  # torch>=2.9's default ONNX exporter is dynamo-based and requires this;
  # without it torch.onnx.export raises ModuleNotFoundError at call time.
  "onnxscript>=0.7.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=6.0",
  "mypy>=2.3.1",
  # Dev-only: verifies rul.onnx round-trips through a real inference session
  # in tests, not used by the training pipeline itself (mirrors DD-002's
  # precedent for edge's dev-only `onnx` dep).
  "onnxruntime>=1.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.mypy]
strict = true
files = "src"

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "torch.*",
  "pandas.*",
  "skl2onnx.*",
  "onnx.*",
  "onnxscript.*",
  "scipy.*",
  "onnxruntime.*",
  # scripts/make_paper_figures.py only; pulled in ad hoc via `uv run --with`.
  "matplotlib.*",
  "seaborn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.uv]
# CPU-only PyTorch wheels: this image trains on a dev PC / CI runner, not a
# GPU box, and CUDA wheels would add multiple gigabytes to every build for no
# benefit. Deployment inference uses TFLite (see services/edge), not torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project]
name = "ml"
version = "0.1.0"
description = "Digital Cousin ML training pipeline: Isolation Forest + 1D conv autoencoder on CWRU/IMS datasets"
requires-python = ">=3.11,<3.12"
dependencies = [
  "scikit-learn>=1.5",
  "torch>=2.5",
  "numpy>=2.0",
  "pandas>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "mypy>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.mypy]
strict = true
files = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "torch.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.uv]
# CPU-only PyTorch wheels: this image trains on a dev PC / CI runner, not a
# GPU box, and CUDA wheels would add multiple gigabytes to every build for no
# benefit. Deployment inference uses TFLite (see services/edge), not torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
